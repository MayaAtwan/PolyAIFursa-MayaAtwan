name: Deploy Agent Service

# Only triggers when files inside services/agent/ change.
on:
  push:
    branches: [dev, main]
    paths:
      - 'services/agent/**'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agent:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to Dev server
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1
        with:
          host: maya-dev.fursa.click
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd ~/PolyAIFursa-MayaAtwan
            git pull origin dev
            sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${{ github.sha }}|" .env \
              || echo "AGENT_IMAGE_TAG=${{ github.sha }}" >> .env
            docker compose pull agent
            docker compose up -d agent

      - name: Deploy to Prod server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: maya-prod.fursa.click
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd ~/PolyAIFursa-MayaAtwan
            git pull origin main
            sed -i "s|^AGENT_IMAGE_TAG=.*|AGENT_IMAGE_TAG=${{ github.sha }}|" .env \
              || echo "AGENT_IMAGE_TAG=${{ github.sha }}" >> .env
            docker compose pull agent
            docker compose up -d agent
